<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>YT Playlist Builder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <h1>YT Playlist Builder</h1>

      <section id="input-section">
        <label for="songs-input">Paste your song list:</label>
        <textarea id="songs-input" rows="10" placeholder="Black Sabbath - Iron Man&#10;Metallica - One&#10;&#10;or numbered blocks:&#10;1. Black Sabbath&#10;&#10;Iron Man&#10;War Pigs"></textarea>
        <button id="go-btn">Search YouTube</button>
      </section>

      <section id="progress-section" hidden>
        <p id="progress-line">Searching...</p>
      </section>

      <section id="results-section" hidden>
        <h2>Matches</h2>
        <table id="results-table">
          <thead>
            <tr><th>#</th><th>Song</th><th>Match</th><th>Channel</th><th>Status</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <p id="status" role="status"></p>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
