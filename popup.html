<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>YT Playlist Builder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <div id="app-header">
        <h1>YT Playlist Builder</h1>
        <!-- U+2615 + U+FE0E: the variation selector forces text presentation, so this
             stays a monochrome glyph instead of rendering as a colour emoji. -->
        <button id="tip-btn" title="Support this extension" aria-expanded="false">&#x2615;&#xFE0E; = &#x2665;&#xFE0E;</button>
      </div>

      <section id="tip-panel" hidden>
        <p>This extension is free and always will be. A coffee is always appreciated.</p>
        <p><a id="tip-link" href="https://revolut.me/rebe000" target="_blank" rel="noopener noreferrer">revolut.me/rebe000</a></p>
        <img id="tip-qr" src="icons/tip-qr.png" width="150" height="150" alt="Revolut QR code for revolut.me/rebe000" />
      </section>

      <section id="account-section">
        <div id="account-info">
          <img id="account-avatar" alt="" width="28" height="28" hidden />
          <span id="account-status">Not signed in</span>
        </div>
        <div id="account-actions">
          <button id="signout-btn" hidden title="Clear the cached Google sign-in for this extension">Sign out</button>
          <button id="addaccount-btn" title="Sign in with a different Google account (shows account picker)">Add account</button>
        </div>
      </section>

      <section id="input-section">
        <label for="songs-input">Paste your song list:</label>
        <textarea id="songs-input" rows="10" placeholder="Black Sabbath - Iron Man&#10;Metallica - One&#10;&#10;or numbered blocks:&#10;1. Black Sabbath&#10;&#10;Iron Man&#10;War Pigs"></textarea>
        <section id="confirm-dialog" hidden>
          <p id="confirm-message"></p>
          <p><strong id="confirm-warning"></strong></p>
          <div id="confirm-actions">
            <button id="confirm-cancel-btn">Cancel</button>
            <button id="confirm-proceed-btn">Discard and search</button>
          </div>
        </section>
        <button id="go-btn">Search YouTube</button>
      </section>

      <section id="target-section">
        <fieldset id="target-fieldset">
          <legend>Playlist target</legend>
          <label>
            <input type="radio" name="target" value="create" checked />
            Create new
          </label>
          <div id="create-fields">
            <input type="text" id="new-title" placeholder="New playlist name" />
            <select id="new-privacy">
              <option value="unlisted" selected>Unlisted</option>
              <option value="public">Public</option>
              <option value="private">Private</option>
            </select>
          </div>
          <label>
            <input type="radio" name="target" value="existing" />
            Add to existing
          </label>
          <div id="existing-fields" hidden>
            <select id="existing-playlist">
              <option value="">— sign in to load your playlists —</option>
            </select>
            <button id="load-playlists-btn">Load my playlists</button>
          </div>
        </fieldset>
      </section>

      <section id="progress-section" hidden>
        <div id="progress-bar" class="progress-bar" hidden><div id="progress-fill" class="progress-fill"></div></div>
        <p id="progress-status" class="progress-status"><span id="progress-line">Searching...</span><span id="progress-eta" class="progress-eta" hidden></span></p>
      </section>

      <section id="results-section" hidden>
        <h2>Matches</h2>
        <table id="results-table">
          <thead>
            <tr><th><input type="checkbox" id="select-all" checked title="Select / deselect all"></th><th>#</th><th>Song</th><th>Match</th><th>Channel</th><th>Status</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <p id="status" role="status"></p>

      <section id="commit-section" hidden>
        <button id="add-all-btn">Add all to playlist</button>
        <button id="open-playlist-btn" hidden>Open playlist</button>
      </section>

      <section id="insert-progress-section" hidden>
        <div id="insert-progress-bar" class="progress-bar"><div id="insert-progress-fill" class="progress-fill"></div></div>
        <p id="insert-progress-status" class="progress-status"><span id="insert-progress-line"></span><span id="insert-progress-eta" class="progress-eta" hidden></span></p>
      </section>

      <section id="reset-section" hidden>
        <button id="reset-btn">Reset</button>
      </section>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
